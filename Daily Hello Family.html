<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Daily Hello Family</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fredoka:wght@600&display=swap">
<style>
/* Layout: health-app pattern. Story-style people row, large title, segmented Check-in / History / Trends, grouped rounded cards on a soft grey ground. Light-only by choice. */
:root{
  color-scheme:light;
  --bg:#F2F3F7; --surface:#FFFFFF; --sunk:#F2F3F7; --ink:#14161C; --muted:#6E7385; --line:#E4E6EE;
  --copd:#2F7FE0; --copd-soft:#E3EEFC; --park:#7B5BD6; --park-soft:#EEE9FC; --asth:#13A37F; --asth-soft:#DDF5EE; --hyp:#F06A2B; --hyp-soft:#FEE9DE;
  --rose:#D9466F; --rose-soft:#FCE4EC; --indigo:#4B57D1; --indigo-soft:#E7E9FC; --sky:#1C93BD; --sky-soft:#DCF1F9;
  --good:#24A148; --good-soft:#E2F5E7; --watch:#E39A00; --watch-soft:#FFF2D6; --alert:#E5383B; --alert-soft:#FDE3E3; --none:#A7ACBB;
  --t:var(--copd); --t-soft:var(--copd-soft);
  --f:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-brand:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --r:20px;
}
body[data-thread="copd"]{--t:var(--copd);--t-soft:var(--copd-soft)}
body[data-thread="parkinsons"]{--t:var(--park);--t-soft:var(--park-soft)}
body[data-thread="asthma"]{--t:var(--asth);--t-soft:var(--asth-soft)}
body[data-thread="hypoxia"]{--t:var(--hyp);--t-soft:var(--hyp-soft)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 56px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--t);outline-offset:2px;border-radius:12px}
.num{font-variant-numeric:tabular-nums}
.cap{font-size:13px;color:var(--muted);font-weight:500}
.eyebrow{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.eyebrow svg{width:16px;height:16px}

/* top */
.top{display:flex;justify-content:space-between;align-items:center}
.brand{font-family:var(--f-brand);font-weight:600;font-size:21px;display:flex;align-items:center;gap:8px}
.me{width:36px;height:36px;border-radius:50%;background:#FFD8C2;color:#9A4316;display:grid;place-items:center;font-weight:800;font-size:14px}

/* stories row */
.stories{display:flex;gap:18px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}
.story{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;flex:none;width:76px}
.ring{display:block;width:68px;height:68px;border-radius:50%;padding:3px;background:conic-gradient(var(--sc) 0 100%)}
.ring .in{display:block;width:100%;height:100%;border-radius:50%;background:var(--surface);padding:3px}
.ring .face{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:var(--c-soft);color:var(--c);font-weight:800;font-size:19px}
.story .n{font-size:13px;font-weight:600;max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story[aria-selected="true"] .n{color:var(--c)}
.story[aria-selected="true"] .ring{transform:scale(1.06)}
.story .dot{font-size:11px;color:var(--muted);margin-top:-4px}

/* title */
.title{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.title h1{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.title .cond{display:inline-flex;align-items:center;gap:6px;color:var(--t);font-weight:700;font-size:15px;margin-bottom:4px}
.title .cond svg{width:18px;height:18px}

.seg{display:grid;grid-template-columns:repeat(3,1fr);background:#E3E5EC;border-radius:12px;padding:3px;max-width:420px;width:100%}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 10px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,22,28,.12)}

/* banner */
.banner{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--alert);color:#FFFFFF;border-radius:var(--r);padding:14px 16px}
.banner b{display:block;font-size:16px}
.banner span{font-size:14px;opacity:.92}
.banner button{background:#FFFFFF;color:var(--alert);border:0;border-radius:999px;padding:8px 14px;font-weight:700;white-space:nowrap}
.banner svg{width:28px;height:28px}

/* grid */
.cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--surface);border-radius:var(--r);padding:18px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.card h3{font-size:18px;font-weight:700}
.link{background:none;border:0;color:var(--t);font-weight:700;font-size:14px;padding:4px}

/* score */
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.score svg.gauge{width:132px;height:132px}
.score .big{font-size:40px;font-weight:800;letter-spacing:-.03em}
.score .lbl{font-size:20px;font-weight:700;margin-top:2px}
.score p{margin:6px 0 0;color:var(--muted);font-size:14px;max-width:44ch}

/* highlight */
.hl .eyebrow{color:var(--t)}
.hl .sum{font-size:18px;font-weight:600;line-height:1.5;margin:8px 0 0;max-width:62ch}
.hl blockquote{margin:12px 0 0;background:var(--sunk);border-radius:14px;padding:10px 14px;font-style:italic;color:#3A3F4E}
.hl blockquote cite{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
.hl .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--t-soft);color:var(--t)}
.tag.ex{background:var(--sunk);color:var(--muted)}
.btn{border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;border:0;background:var(--t);color:#FFFFFF}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .eyebrow{color:var(--lv)}
.tile .v{font-size:22px;font-weight:800;letter-spacing:-.01em;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile svg.spark{width:100%;height:34px;margin-top:6px}
.lv-good{--lv:var(--good)} .lv-watch{--lv:var(--watch)} .lv-alert{--lv:var(--alert)} .lv-none{--lv:var(--none)}

/* lists */
ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.flag{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.flag:first-child{border-top:0;padding-top:0}
.flag .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#FFFFFF;font-weight:800;font-size:15px}
.flag .k{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.todo li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.todo li:first-child{border-top:0;padding-top:0}
.todo input{width:22px;height:22px;margin:0;accent-color:var(--t)}
.todo input:checked + label{color:var(--muted);text-decoration:line-through}
.empty{color:var(--muted);font-size:15px}

.vrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.vrow:first-child{border-top:0;padding-top:0}
.vrow .val{font-weight:800;color:var(--lv)}
.vrow .cap{grid-column:1/-1}

/* transcript */
details summary{cursor:pointer;font-weight:700;font-size:16px;list-style:none;display:flex;justify-content:space-between}
details summary::after{content:"Show";color:var(--t);font-size:14px}
details[open] summary::after{content:"Hide"}
.lines{display:flex;flex-direction:column;gap:6px;margin-top:14px;min-width:0}
.bub{max-width:min(82%,520px);min-width:0;padding:9px 13px;border-radius:18px;font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.bub .who{display:block;font-size:11px;font-weight:700;opacity:.7;margin-bottom:1px}
details summary{gap:10px;align-items:baseline}
details summary::after{flex:none}
@media (max-width:520px){.bub{max-width:92%}}
.bub.ai{align-self:flex-start;background:var(--sunk);border-bottom-left-radius:6px}
.bub.them{align-self:flex-end;background:var(--t);color:#FFFFFF;border-bottom-right-radius:6px}

/* history */
.hist .item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 2px}
.hist .item:first-child{border-top:0}
.hist .badge{min-width:76px;height:28px;padding:0 10px;border-radius:999px;display:grid;place-items:center;color:#FFFFFF;font-weight:800;font-size:12px;white-space:nowrap}
.hist .d{font-weight:700}
.hist .s{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.chev{color:var(--none);font-size:20px}
.composer textarea{width:100%;min-height:170px;border:1px solid var(--line);border-radius:14px;background:var(--sunk);color:var(--ink);padding:12px;font:14px/1.55 ui-monospace,Menlo,monospace;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.msg{font-size:14px;color:var(--muted);min-height:1.4em;margin-top:8px}
.msg.err{color:var(--alert)}

/* settings */
.top-r{display:flex;align-items:center;gap:10px}
.gear{width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.gear svg{width:20px;height:20px}
.gear[aria-pressed="true"]{background:var(--ink);color:#FFFFFF}
fieldset.set-p{border:0;margin:0 0 12px;padding:14px;background:var(--sunk);border-radius:16px;min-width:0}
.set-who{display:flex;align-items:center;gap:10px;padding:0;margin-bottom:12px;float:left;width:100%}
.set-who b{display:block}
.face.sm{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--c-soft);color:var(--c);font-weight:800;font-size:14px;flex:none}
.fields{clear:both;display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.fld input{font:inherit;font-size:16px;font-weight:500;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
.fld input:focus{outline:none;border-color:var(--t);box-shadow:0 0 0 3px var(--t-soft)}
.fld input[aria-invalid="true"]{border-color:var(--alert)}
.ferr{font-style:normal;color:var(--alert);font-size:12px}
.link.inline{padding:0;font-size:inherit}
.bph{display:block;margin-top:3px}
.bph b{display:inline;font-size:inherit}
@media (max-width:620px){.fields{grid-template-columns:1fr 1fr}.fields .fld:first-child{grid-column:1/-1}}

/* condition watch */
.det{display:flex;flex-direction:column}
.det-row{display:grid;grid-template-columns:auto minmax(0,1fr) 150px;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.det-row:first-child{border-top:0;padding-top:0}
.det-ic{width:42px;height:42px;border-radius:13px;background:var(--c-soft);color:var(--c);display:grid;place-items:center}
.det-ic svg{width:24px;height:24px}
.det-name{font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.own{font-size:11px;font-weight:800;color:var(--c);background:var(--c-soft);border-radius:999px;padding:2px 8px}
.det-why{font-size:14px;margin-top:3px}
.det-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:0}
.det-pill{font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;white-space:nowrap}
.dp-good{background:var(--good-soft);color:var(--good)} .dp-watch{background:var(--watch-soft);color:var(--watch)} .dp-alert{background:var(--alert-soft);color:var(--alert)} .dp-none{background:var(--sunk);color:var(--muted)}
.det-side svg.spark{width:140px;height:28px;display:block}
.dp-skip{background:var(--sunk);color:var(--muted)}
.addc{width:36px;height:36px;flex:none;border-radius:50%;border:0;background:var(--t);color:#FFFFFF;font-size:24px;font-weight:600;line-height:1;display:grid;place-items:center;transition:transform .15s}
.addc[aria-expanded="true"]{transform:rotate(45deg)}
.picker{background:var(--sunk);border-radius:16px;padding:12px;margin-bottom:14px}
.copts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.copt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px}
.copt:hover{border-color:var(--c)}
.copt .det-ic{width:36px;height:36px;border-radius:11px}
.copt .det-ic svg{width:20px;height:20px}
.copt b{font-size:14px;display:block}
.copt .cap{font-size:12px}
.basis{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-top:4px}
.basis span{color:var(--c);white-space:nowrap}
.det-x{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:0 6px;border-radius:8px}
.det-x:hover{color:var(--alert);background:var(--alert-soft)}
@media (max-width:620px){.copts{grid-template-columns:1fr}}
@media (max-width:520px){.det-row{grid-template-columns:auto minmax(0,1fr)}.det-side{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}}

.slist{display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr) auto 28px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0;padding-top:0}
.sw{width:14px;height:14px;border-radius:5px}
.sl{font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sv{text-align:right;display:flex;flex-direction:column;white-space:nowrap}
.sv b{font-size:17px}
.chipset{border:0;margin:10px 0 0;padding:0;min-width:0}
.chipset legend{font-size:13px;font-weight:600;color:var(--muted);padding:0;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipc{position:relative;display:inline-flex}
.chipc input{position:absolute;opacity:0;width:1px;height:1px}
.chipc span{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;user-select:none}
.chipc span::before{content:"+";font-weight:800;color:var(--muted)}
.chipc input:checked + span{background:var(--c-soft);border-color:var(--c);color:var(--c)}
.chipc input:checked + span::before{content:"\2713";color:var(--c)}
.chipc input:disabled + span{cursor:default}
.chipc input:focus-visible + span{outline:3px solid var(--c);outline-offset:2px}
.chipset + .fields{margin-top:10px}
.vsum{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;margin-bottom:12px}
.pwrap{background:var(--sunk);border-radius:14px;padding:10px 12px 8px;margin-bottom:12px}
.pstrip{width:100%;height:70px;display:block}
.plegend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:4px}
.plegend i{display:inline-block;vertical-align:middle;margin-right:5px}
.lg-speech{width:6px;height:12px;border-radius:3px;background:var(--t)}
.lg-gap{width:10px;height:2px;background:#C3C7D3}
.lg-breath{width:8px;height:8px;border-radius:50%;background:#1C93BD}
.meter{margin-top:12px}
.m-top{display:flex;justify-content:space-between;font-size:14px}
.m-top b{color:var(--lv)}
.m-track{position:relative;height:10px;border-radius:999px;margin-top:6px}
.m-fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--lv);opacity:.35}
.m-dot{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--lv);border:3px solid #FFFFFF;box-shadow:0 1px 4px rgba(20,22,28,.25);transform:translate(-50%,-50%)}
.m-usual{position:absolute;top:-4px;bottom:-4px;width:2px;background:#6E7385;border-radius:1px}
.m-marks{display:flex;font-size:11px;color:var(--muted);margin-top:4px}
.m-marks span{text-align:center}
.m-note{font-size:11px;color:var(--muted);margin-top:2px}
.pwrap{position:relative}
.pwrap.seekable{cursor:pointer}
.phead{position:absolute;top:10px;height:70px;width:2px;margin-left:-1px;background:#1E2230;border-radius:1px;pointer-events:none;left:12px}
.phead::before{content:"";position:absolute;top:-4px;left:-4px;width:10px;height:10px;border-radius:50%;background:#1E2230}
.player{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-2px 0 6px}
.pbtn{width:42px;height:42px;flex:none;border-radius:50%;border:0;background:var(--t);color:#FFFFFF;display:grid;place-items:center;padding-left:2px}
.pbtn:disabled{background:#D5D8E2;cursor:default}
.ptime{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.ptime b{color:var(--ink)}
.pspeed{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-weight:700;font-size:13px}
.pspeed:disabled{color:var(--muted);cursor:default}
.pstatus{font-size:13px;color:var(--muted);min-width:0}
.pstatus.err{color:var(--alert)}
.pfile{margin-left:auto;font-size:13px;font-weight:700;color:var(--t);cursor:pointer;position:relative;padding:4px 2px}
.pfile input{position:absolute;inset:0;opacity:0;width:1px;height:1px}
.pfile:focus-within{outline:3px solid var(--t);outline-offset:2px;border-radius:8px}
.nodata{background:var(--sunk);border-radius:14px;padding:26px 16px;text-align:center;color:var(--muted);font-size:14px}
.chart .pt{cursor:pointer;outline:none}
.card-h .det-x{font-size:22px;padding:2px 8px}
.heat td span[data-tip]{cursor:help}
.hl-in{border-top:1px solid var(--line);margin-top:16px;padding-top:16px}

/* tooltips */
#tip{position:fixed;left:0;top:0;z-index:50;pointer-events:none;background:#1E2230;color:#FFFFFF;border-radius:12px;padding:9px 12px;font-size:13px;line-height:1.35;box-shadow:0 8px 24px rgba(20,22,28,.22);max-width:250px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;display:flex;flex-direction:column;gap:2px}
#tip.on{opacity:1;transform:none}
#tip b{font-size:14px}
#tip .d{color:#B8BDCB}
#tip .lvl{display:inline-flex;align-items:center;gap:6px;margin-top:3px;font-weight:700}
#tip .lvl::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
#tip .l-good{color:#7BE3A1} #tip .l-watch{color:#FFD066} #tip .l-alert{color:#FF8A80} #tip .l-none{color:#B8BDCB}
.spark .hit{cursor:pointer;outline:none}
.spark circle{transition:r .12s}
.spark circle.hot{r:5px;stroke:#1E2230;stroke-width:1.5px}
.tile .v[data-tip],.wk-c[data-tip]{cursor:help}

/* people editor */
.fld select,.fld textarea{font:inherit;font-size:16px;font-weight:500;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
.fld textarea{resize:vertical;min-height:70px;line-height:1.45}
.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--t);box-shadow:0 0 0 3px var(--t-soft)}
.fld input:disabled{background:var(--sunk);color:var(--muted)}
.fld.wide{margin-top:10px}
.fields.f4{grid-template-columns:1.4fr 1.2fr .6fr 1fr}
.fields.f3{grid-template-columns:1fr 1fr 1fr}
.fields.f2{grid-template-columns:1fr 1fr}
.fields.f1{grid-template-columns:1fr}
.fields + .fields{margin-top:10px}
.plist{display:flex;flex-direction:column;gap:10px}
details.pcard{background:var(--sunk);border-radius:16px;--t:var(--c);--t-soft:var(--c-soft)}
details.pcard summary{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;font-weight:400;font-size:16px}
details.pcard summary::after{content:none}
details.pcard summary::-webkit-details-marker{display:none}
.pc-t b{display:block}
.pc-t .cap{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-edit{color:var(--c);font-weight:700;font-size:14px}
details.pcard[open] .pc-edit{color:var(--muted)}
.pc-body{padding:0 14px 16px}
.sect{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--c);margin:14px 0 8px}
.btn.danger{color:var(--alert)}
@media (max-width:620px){.fields.f4,.fields.f3,.fields.f2{grid-template-columns:1fr 1fr}.fields.f4 .fld:first-child,.fields.f3 .fld:first-child{grid-column:1/-1}}

/* weekly check-in */
#view{display:flex;flex-direction:column;gap:18px}
.wk-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.wk-wrap{overflow-x:auto;margin:0 -6px}
.wk{border-collapse:separate;border-spacing:6px;width:100%;min-width:600px}
.wk th[scope=row]{text-align:left;font-size:14px;font-weight:600;white-space:nowrap;padding-right:4px}
.wk-m{display:inline-flex;align-items:center;gap:8px}
.wk-m svg{width:18px;height:18px;color:var(--t)}
.wk-day{width:100%;border:0;background:transparent;border-radius:14px;padding:6px 4px 8px;font-weight:700;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:5px}
.wk-day:hover{background:var(--sunk)}
.wk-day.on{background:var(--t-soft);color:var(--t)}
.sb{white-space:nowrap;min-width:30px;height:22px;border-radius:999px;color:#FFFFFF;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 7px}
.wk-c{display:block;text-align:center;border-radius:12px;padding:8px 6px;font-size:13px;font-weight:700;white-space:nowrap}
td.on .wk-c{box-shadow:0 0 0 2px var(--t)}
.wk-good{background:var(--good-soft);color:var(--good)} .wk-watch{background:var(--watch-soft);color:var(--watch)} .wk-alert{background:var(--alert-soft);color:var(--alert)} .wk-none{background:var(--sunk);color:var(--muted);font-weight:500}

/* trends */
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.heat{overflow-x:auto}
.heat table{border-collapse:separate;border-spacing:4px;width:100%;table-layout:fixed}
.heat th[scope=row]{width:84px;white-space:normal;line-height:1.2}
.heat thead th{font-size:12px;white-space:normal;line-height:1.2}
.heat th{font-size:13px;font-weight:600;color:var(--muted);text-align:left;white-space:nowrap}
.heat thead th{text-align:center}
.heat td span{display:block;height:26px;border-radius:8px}

.spin{display:inline-block;width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
@media (max-width:520px){
  .title h1{font-size:28px}
  .score{grid-template-columns:1fr;justify-items:start}
  .tiles{gap:10px}
  .tile .v{font-size:19px}
  .banner{grid-template-columns:auto 1fr}
  .banner button{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  if (!vp) return `<div class="card">${head}<p class="empty" style="margin:0 0 12px">No voice measurements for this call. ${state.off ? "" : "Re-summarize with Claude to get an estimate from the words."}</p>${player(c)}</div>`;
  const sLv = vp.str < 50 ? "alert" : (vp.ustr && vp.str < vp.ustr - 8) ? "watch" : "good";
  const fLv = vp.flow < 45 ? "alert" : vp.flow < 70 ? "watch" : "good";
  const rows = [];
  if (vp.pace != null){ const d = vp.pace - vp.upace, lv = Math.abs(d) > 25 ? "alert" : Math.abs(d) > 10 ? "watch" : "good";
    rows.push(["Pace", `${vp.pace} wpm`, `Usually ${vp.upace}${d ? `, ${d > 0 ? "faster" : "slower"}` : ""}`, lv]); }
  if (vp.steady) rows.push(["Steadiness", vp.steady[0], "Tremor, slurring or a flat tone", vp.steady[1]]);
  rows.push(["Breathing", vp.breath[0], "Heard between and during words", vp.breath[1]]);
  if (vp.bps != null){ const lv = vp.bps >= 2 ? "alert" : vp.bps > (vp.ubps || 1) + .3 ? "watch" : "good";
    rows.push(["Breaths per sentence", String(vp.bps), `Usually ${vp.ubps}`, lv]); }
  const levels = [sLv, fLv, ...rows.map(r => r[3])];
  const overall = levels.includes("alert") ? "alert" : levels.includes("watch") ? "watch" : "good";
  const sumText = {good:"Voice and breathing sounded like their usual self.", watch:"Some changes from their usual voice or breathing.", alert:"Clear changes in voice or breathing on this call."}[overall];
  return `<div class="card">${head}
    <div class="vsum lv-${overall}"><span class="det-pill dp-${overall}">${{good:"Usual",watch:"Some changes",alert:"Big changes"}[overall]}</span><span>${sumText}</span></div>
    <div class="pwrap ${srcOf(c) ? "seekable" : ""}" data-seekwrap="${c.id}" ${srcOf(c) ? `title="Click to jump to that point"` : ""}>${patternStrip(c, vp)}<span class="phead" id="phead" ${srcOf(c) ? "" : "hidden"}></span><div class="plegend"><span><i class="lg-speech"></i>Speaking</span><span><i class="lg-gap"></i>Pause</span><span><i class="lg-breath"></i>Breath</span></div></div>${player(c)}
    ${meter("Voice strength", vp.str, vp.ustr, [["Weak",50,"var(--alert-soft)"],["Normal",80,"var(--good-soft)"],["Strong",100,"#DCEBFB"]], strWord(vp.str), sLv)}
    ${meter("Flow", vp.flow, null, [["Broken",45,"var(--alert-soft)"],["Some breaks",70,"var(--watch-soft)"],["Smooth",100,"var(--good-soft)"]], flowWord(vp.flow), fLv)}
    <div style="margin-top:6px">${rows.map(([l,v,u,lv]) => `<div class="vrow lv-${lv}"><span>${esc(l)}</span><span class="val">${esc(v)}</span><span class="cap">${esc(u)}</span></div>`).join("")}</div>
    <p class="cap" style="margin:10px 0 0">${vp.est ? `Estimated by Claude from the transcript wording${vp.note ? `: ${esc(vp.note)}` : "."} ` : "The pattern is drawn from this call's measurements, not the raw recording. "}${esc(t.trend.note)} Not a diagnosis.</p></div>`;
}

function checkin(){
  const t = th(), c = t.calls.find(x => x.id === state.sel[state.thread]);
  if (!c) return emptyState();
  if (c.missed) return weekly(c.id) + `<div class="card"><div class="eyebrow" style="color:var(--muted)">Missed call · ${esc(c.date)}</div><p style="margin:8px 0 0;max-width:62ch">${esc(c.note)}</p><div class="row"><button class="btn ghost" type="button" data-go="history">Back to history</button></div></div>`;
  const s = c.s, [col, word] = STAT[s.status];
  const tiles = t.metrics.map(([k,l,ic]) => { const m = s.metrics[k] || ["—","none"];
    const cnt = {good:0, watch:0, alert:0};
    t.calls.forEach(x => { const lv = x.missed ? null : x.s?.metrics?.[k]?.[1]; if (lv in cnt) cnt[lv]++; });
    const extra = `Last ${t.calls.length} check-ins: ${cnt.good} good, ${cnt.watch} watch, ${cnt.alert} concern`;
    return `<div class="tile lv-${m[1]}"><div class="eyebrow">${ICON[ic]}${esc(l)}</div><div class="v" tabindex="0" data-tip="1" data-val="${esc(l)}: ${esc(m[0])}" data-day="${esc(c.date)}" data-extra="${esc(extra)}" data-lv="${m[1]}">${esc(m[0])}</div>${spark(k)}<div class="cap">Hover the line for each day</div></div>`; }).join("");
  const flags = s.flags.length ? s.flags.map(([lv,tx]) => `<li class="flag"><span class="ic" style="background:${lv==="urgent"?"var(--alert)":"var(--watch)"}">!</span><div><div class="k" style="color:${lv==="urgent"?"var(--alert)":"var(--watch)"}">${lv==="urgent"?"Urgent":"Keep an eye on"}</div>${esc(tx)}</div></li>`).join("") : `<li class="empty">Nothing to flag today.</li>`;
  const todo = s.todo.length ? s.todo.map((x,i) => `<li><input type="checkbox" id="td-${c.id}-${i}"><label for="td-${c.id}-${i}">${esc(x)}</label></li>`).join("") : `<li class="empty">You're all caught up.</li>`;
  const voice = c.voice ? c.voice.map(([l,v,u,lv]) => `<div class="vrow lv-${lv}"><span>${esc(l)}</span><span class="val">${esc(v)}</span><span class="cap">${esc(u)}</span></div>`).join("") : `<p class="empty" style="margin:0">No voice data for pasted transcripts.</p>`;
  return weekly(c.id) + `<div class="cols">
    <div class="stack">
      <div class="card score">${gauge(s.status, col)}<div><div class="cap">How ${esc(t.short)} is doing · ${esc(c.date)}</div><div class="lbl" style="color:${col}">${word}</div><p>Based on ${t.metrics.map(m=>m[1].toLowerCase()).join(", ")} on this call.</p></div></div>
      ${detection(t, c, `<div class="hl hl-in"><div class="eyebrow">${ICON.spark}Highlight from Claude</div>
        <p class="sum">${esc(s.summary)}</p>
        ${s.quote ? `<blockquote>“${esc(s.quote)}”<cite>${esc(t.short)}, ${esc(c.time)}</cite></blockquote>` : ""}
        <div class="foot"><span class="tag ${c.byClaude?"":"ex"}">${c.byClaude ? "Written by Claude just now" : "Example summary"}</span>
          <button class="btn" type="button" id="reSum" ${state.off || state.busy ? "disabled" : ""}>Re-summarize with Claude</button></div>
        <div class="msg" id="reMsg" role="status">${state.off ? "Claude isn't available in this view." : state.busy === c.id ? `<span class="spin"></span> Claude is checking this day…` : (!c.byClaude && !c.autoTried ? "Claude checks each day automatically the first time you open it." : "")}</div>
      </div>`)}
      <div class="tiles">${tiles}</div>
      <div class="card"><details open><summary><span>Conversation · ${c.tx.length} messages · ${esc(c.dur)}</span></summary>
        <div class="lines">${c.tx.map(([w,x]) => `<div class="bub ${w==="AI"?"ai":"them"}"><span class="who">${w==="AI"?"June":esc(t.short)}</span>${esc(x)}</div>`).join("")}</div></details></div>
    </div>
    <div class="stack">
      <div class="card"><div class="card-h"><h3>Flags</h3></div><ul class="plain">${flags}</ul></div>
      <div class="card"><div class="card-h"><h3>To do for ${esc(t.short)}</h3></div><ul class="plain todo">${todo}</ul></div>
      ${voiceCard(t, c)}
    </div></div>`;
}

function history(){

    </div></div>`;

const SIGNALS = [
  ["sleep","Hours of sleep"," h",7,false,"moon","Under 6 hours several nights in a row is worth mentioning to a doctor."],
  ["call","Call length"," min",null,null,"spark","Much shorter calls than usual can mean someone is tired or unwell."],
  ["pace","Speaking pace"," wpm","usual",false,"head","Slower speech than usual can come with tiredness, low oxygen or low mood."],
  ["pauses","Pauses while speaking","%","usual",true,"wind","More pauses for breath can mean breathing is harder."],
  ["spo2","Oxygen (SpO2)","%",95,false,"drop","From a finger oximeter reading they share on the call."],
  ["coughs","Coughs during the call","",1,true,"wind","More coughing on calls can mean breathing is less controlled."],
  ["loudness","Voice loudness"," dB",0,false,"mood","A quieter voice than usual is common in Parkinson's."],
  ["puffer","Rescue puffer uses","",0,true,"pill","Needing the rescue puffer more often can mean asthma is less controlled."]
];
const MAIN_SIG = {parkinsons:"loudness", asthma:"coughs", hypoxia:"spo2"};
const num = s => { const m = String(s ?? "").replace("−","-").match(/-?\d+(\.\d+)?/); return m ? Number(m[0]) : null; };
const voiceFind = (c, re) => (c.voice || []).find(v => re.test(v[0]));
function sigValue(k, c){
  if (!c || c.missed || !c.s) return null;
  const n = c.s.nums || {};
  switch (k){
    case "sleep": return n.sleepHours ?? (/hour/i.test(c.s.metrics.sleep?.[0] || "") ? num(c.s.metrics.sleep[0]) : null);
    case "call": return /min/.test(c.dur || "") ? num(c.dur) : null;
    case "pace": { const v = voiceFind(c, /pace/i); return v && /wpm/.test(v[1]) ? num(v[1]) : null; }
    case "pauses": { const v = voiceFind(c, /pause/i); return v && /%/.test(v[1]) ? num(v[1]) : null; }
    case "spo2": return n.spo2 ?? num(c.s.metrics.spo2?.[0]);
    case "coughs": { const v = voiceFind(c, /cough/i); return v ? num(v[1]) : null; }
    case "loudness": { const v = voiceFind(c, /loud/i); return v ? num(v[1]) : null; }
    case "puffer": return n.pufferUses ?? num(c.s.metrics.puffer?.[0]);
  }
  return null;
}
function sigNormal(k, t, def){
  if (def !== "usual") return def;
  for (const c of t.calls){ const v = voiceFind(c, k === "pace" ? /pace/i : /pause/i); if (v){ const u = num(v[2]); if (u != null) return u; } }
  return null;
}
function cleanNums(r){
  if (!r || typeof r !== "object") return null;
  const out = {};
  for (const k of ["sleepHours","spo2","pufferUses"]){ const v = r[k]; out[k] = (v === null || v === "" || v === undefined || !isFinite(Number(v))) ? null : Number(v); }
  return out;
}
const trendsOf = (id = state.thread) => (cfg(id).trends || []).filter(k => SIGNALS.some(s => s[0] === k));
function setTrends(arr){ SET.people[state.thread] = {...(SET.people[state.thread] || {}), cond: th().k, trends: arr}; saveSet(); }

const SERIES_COLORS = ["#7B5BD6","#E0457B","#1C93BD","#C2410C","#0F766E","#4B57D1","#9D5C0D","#6B7280"];

function combinedChart(t, list){
  const calls = t.calls.slice().reverse(), n = calls.length;
  const W = 640, H = 250, L = 58, R = 18, T = 18, B = 34;
  const x = i => L + (n<2 ? (W-L-R)/2 : i*(W-L-R)/(n-1));
  const yf = f => T + (1-f)*(H-T-B);
  let lines = "", dots = "";
  list.forEach(s => {
    const real = calls.map((c,i) => ({i, v:s.val(c), date:c.date})).filter(p => p.v != null);
    if (!real.length) return;
    const vals = real.map(p => p.v).concat(s.normal != null ? [s.normal] : []);
    const lo = Math.min(...vals), hi = Math.max(...vals);
    const frac = v => { let f = hi === lo ? .5 : (v-lo)/(hi-lo); if (s.higherWorse === false) f = 1-f; return .06 + f*.88; };
    if (real.length > 1) lines += `<path d="${real.map((p,k) => (k?"L":"M")+x(p.i).toFixed(1)+" "+yf(frac(p.v)).toFixed(1)).join(" ")}" fill="none" stroke="${s.color}" stroke-width="${s.main?3.2:2.4}" stroke-linejoin="round" stroke-linecap="round"${s.main?"":` stroke-opacity=".9"`}/>`;
    const last = real[real.length-1];
    dots += real.map(p => `<circle class="pt" cx="${x(p.i).toFixed(1)}" cy="${yf(frac(p.v)).toFixed(1)}" r="${p===last?5.5:4}" fill="${p===last?s.color:"#FFFFFF"}" stroke="${s.color}" stroke-width="2.2" tabindex="0" data-tip="1" data-val="${esc(s.label)}: ${p.v}${esc(s.unit)}" data-day="${esc(p.date)}" data-lv="none" data-lvtext="${s.normal != null ? `Usual ${s.normal}${esc(s.unit)}` : "Reading"}"/>`).join("");
  });
  const grid = [0,.5,1].map(f => `<line x1="${L}" x2="${W-R}" y1="${yf(.06+f*.88).toFixed(1)}" y2="${yf(.06+f*.88).toFixed(1)}" stroke="#ECEEF3"/>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sign trends for ${esc(t.short)} across recent check-ins">
    <defs><linearGradient id="worse" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E5383B" stop-opacity=".07"/><stop offset="1" stop-color="#24A148" stop-opacity=".05"/></linearGradient></defs>
    <rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" rx="10" fill="url(#worse)"/>
    ${grid}
    <text x="${L-10}" y="${(yf(.94)+4).toFixed(1)}" text-anchor="end" font-size="12" font-weight="700" fill="#E5383B">Worse</text>
    <text x="${L-10}" y="${(yf(.06)+4).toFixed(1)}" text-anchor="end" font-size="12" font-weight="700" fill="#24A148">Better</text>
    ${lines}${dots}
    ${calls.map((c,i) => `<text x="${x(i).toFixed(1)}" y="${H-12}" text-anchor="middle" font-size="11" fill="#6E7385">${esc(c.day)}</text>`).join("")}
  </svg>`;
}

function trends(){
  const t = th(), calls = t.calls.slice().reverse();
  if (!calls.length) return emptyState();
  const added = trendsOf();
  const main = {key:"main", main:true, color:"var(--t)", label:t.trend.label, unit:t.trend.unit, normal:t.trend.normal, higherWorse:t.trend.higherWorse, note:t.trend.note, val:c => c.missed ? null : (c.tv ?? null)};
  const extras = added.map((k,i) => { const [,label,unit,normal,hw,ic,note] = SIGNALS.find(s => s[0] === k);
    return {key:k, color:SERIES_COLORS[i % SERIES_COLORS.length], label, unit, normal:sigNormal(k, t, normal), higherWorse:hw, note, icon:ic, val:c => sigValue(k, c)}; });
  const list = [main, ...extras];
  const avail = SIGNALS.filter(s => !added.includes(s[0]) && s[0] !== MAIN_SIG[t.k]);
  const picker = state.tpick ? `<div class="picker"><div class="cap" style="margin-bottom:8px">Add a sign to this chart. Claude pulls these numbers out of each call.</div>
    ${avail.length ? `<div class="copts">${avail.map(([k,label,unit,normal,hw,ic,note]) => { const c = calls.filter(x => sigValue(k,x) != null).length;
      return `<button type="button" class="copt" data-addt="${k}" style="--c:var(--t);--c-soft:var(--t-soft)"><span class="det-ic" aria-hidden="true">${ICON[ic]}</span><span style="min-width:0"><b>${esc(label)}</b><span class="cap" style="display:block">${esc(note)}</span><span class="basis">${c ? `${c} reading${c>1?"s":""} so far` : "No readings yet"} · <span>+ Add</span></span></span></button>`; }).join("")}</div>`
      : `<p class="empty" style="margin:0">Every sign is already on the chart.</p>`}</div>` : "";
  const rows = list.map(s => {
    const vals = calls.map(c => s.val(c)).filter(v => v != null), latest = vals[vals.length-1];
    const dir = s.higherWorse === true ? "Higher is worse" : s.higherWorse === false ? "Lower is worse" : "No better or worse direction";
    return `<div class="srow"><span class="sw" style="background:${s.color}"></span>
      <div style="min-width:0"><div class="sl">${esc(s.label)}${s.main ? `<span class="own" style="--c:var(--t);--c-soft:var(--t-soft)">Main</span>` : ""}</div><div class="cap">${esc(s.note)} ${dir}.</div></div>
      <div class="sv"><b>${latest != null ? `${latest}${esc(s.unit)}` : "—"}</b><span class="cap">${s.normal != null ? `usual ${s.normal}${esc(s.unit)}` : (latest != null ? "latest" : "no readings yet")}</span></div>
      ${s.main ? `<span></span>` : `<button type="button" class="det-x" data-rmt="${s.key}" aria-label="Remove ${esc(s.label)} from the chart" title="Remove">×</button>`}</div>`;
  }).join("");
  const heat = `<table><thead><tr><th></th>${calls.map(c => `<th scope="col">${esc(c.day)}</th>`).join("")}</tr></thead><tbody>${t.metrics.map(([k,l]) => `<tr><th scope="row">${esc(l)}</th>${calls.map(c => {
      const lv = c.missed ? "none" : (c.s.metrics[k]?.[1] || "none");
      const label = c.missed ? "No answer" : (c.s.metrics[k]?.[0] || "—");
      return `<td><span data-tip="1" data-val="${esc(l)}: ${esc(label)}" data-day="${esc(c.date)}" data-lv="${lv}" style="background:${lv==="none"?"#E4E6EE":`var(--${lv})`};opacity:${lv==="good"?.75:1}"></span></td>`; }).join("")}</tr>`).join("")}</tbody></table>`;
  return `<div class="cols"><div class="stack">
      <div class="card"><div class="card-h"><div><div class="eyebrow" style="color:var(--t)">${ICON.spark}Sign trends</div><h3 style="margin-top:4px">How ${esc(t.short)}'s signs are changing</h3></div>
        <button type="button" class="addc" id="addTrend" aria-expanded="${!!state.tpick}" aria-label="Add a sign to the chart" title="Add a sign">+</button></div>
        ${picker}${combinedChart(t, list)}
        <p class="cap" style="margin:8px 0 14px">Each line uses its own scale, turned so that up always means worse. Hover a point for the real reading.</p>
        <div class="slist">${rows}</div>
        <p class="cap" style="margin:12px 0 0">Share changes with a doctor; this is not a diagnosis.</p></div>
    </div><div class="stack">
      <div class="card heat"><h3 style="margin-bottom:10px">Day by day</h3>${heat}
        <div class="legend"><span><i style="background:var(--good)"></i>Good</span><span><i style="background:var(--watch)"></i>Watch</span><span><i style="background:var(--alert)"></i>Concern</span><span><i style="background:#E4E6EE"></i>No answer</span></div></div>
    </div></div>`;
}

function prompt(t, tx, voice){
  const lines = tx.map(([w,x]) => `${w==="AI"?"AI":t.short}: ${x}`).join("\n").slice(0,12000);
  const spec = t.metrics.map(([k,l]) => `"${k}":["2-3 word value for ${l}","good|watch|alert|none"]`).join(",");
  return `You summarize a daily check-in phone call between an AI caller named June and ${t.short}, ${t.who}.
Focus on what matters for ${condAll(t)}. Write warmly and plainly in 2-3 sentences, never diagnose, and describe what was said and what is worth watching.
Use an "urgent" flag only for possible emergencies such as: ${t.urgent}. Use "watch" for things to keep an eye on. status is "alert" if any flag is urgent, "watch" if any watch flag, else "good".
${voice ? "Voice measurements from the call: " + voice.map(v => `${v[0]} ${v[1]} (${v[2]})`).join("; ") + ".\n" : ""}Also screen the call for signs of: ${watchList(t).map(w => w[1] + " (" + w[3] + ")").join("; ")}. Use what was said and any voice measurements. Be conservative: use "good" when nothing points to it, and give a one-sentence plain reason for each. Stroke warning signs are always "alert". In numbers, give a value only if it was said on the call, otherwise null. For voiceEst, estimate voice strength, flow and breathing from the wording only (hesitations, trailing off, ellipses, mentions of being out of breath).
Reply with only this JSON:
{"status":"good|watch|alert","summary":"...","metrics":{${spec}},"numbers":{"sleepHours":"number or null","spo2":"number or null","pufferUses":"number or null"},"voiceEst":{"strength":"weak|normal|strong","flow":"smooth|some breaks|broken","breathing":"easy|labored|very labored","note":"one short sentence on what in the wording suggests this"},"screen":{${watchList(t).map(w => `"${w[0]}":["good|watch|alert","reason"]`).join(",")}},"flags":[["watch|urgent","..."]],"todo":["short action for the reader"],"quote":"a short thing ${t.short} said, under 12 words"}

Transcript:
${lines}`;
}
function clean(t, r){
  const lv = v => ["good","watch","alert","none"].includes(v) ? v : "none";
  const metrics = {};
  for (const [k] of t.metrics){ const m = r?.metrics?.[k]; metrics[k] = Array.isArray(m) ? [String(m[0]||"—").slice(0,22), lv(m[1])] : ["—","none"]; }
  const flags = (Array.isArray(r?.flags)?r.flags:[]).slice(0,5).map(f => Array.isArray(f) ? [f[0]==="urgent"?"urgent":"watch",String(f[1]||"")] : [f?.level==="urgent"?"urgent":"watch",String(f?.text||"")]).filter(f=>f[1]);
  let status = ["good","watch","alert"].includes(r?.status) ? r.status : "watch";
  if (flags.some(f=>f[0]==="urgent")) status = "alert";
  return {status, summary:String(r?.summary||"No summary came back."), metrics, flags, screen:cleanScreen(r?.screen), nums:cleanNums(r?.numbers), voiceEst:cleanVoiceEst(r?.voiceEst), todo:(Array.isArray(r?.todo)?r.todo:[]).slice(0,5).map(String), quote:r?.quote?String(r.quote):""};
}
const errCopy = code => ({not_granted:"Claude wasn't allowed for this page.",sampling_disabled:"Claude isn't available on this account.",rate_limited:"Lots of requests just now. Try again in a minute.",invalid_json:"Claude's answer came back in an odd shape. Try again.",session_expired:"Please sign in to Claude again.",refused:"Claude couldn't summarize this one. Try editing the transcript."}[code] || "Couldn't reach Claude. Try again.");

async function ask(t, tx, voice, btn, msg){
  if (!state.sample){ msg.textContent = "Claude isn't available in this view."; msg.className = "msg err"; return null; }
  btn.disabled = true; msg.className = "msg"; msg.innerHTML = `<span class="spin"></span> Claude is reading the call…`;
  try { return clean(t, await state.sample.json(prompt(t, tx, voice), {cache:false})); }
  catch(e){
    if (["not_granted","sampling_disabled","not_declared","capability_disabled"].includes(e?.code)) state.off = true;
    if (e?.code !== "cancelled"){ msg.textContent = errCopy(e?.code); msg.className = "msg err"; }
    return null;
  } finally { btn.disabled = state.off; }
}
async function resummarize(){
  const t = th(), c = t.calls.find(x => x.id === state.sel[state.thread]);
  if (!c || c.missed || state.busy) return;
  state.busy = c.id; c.autoTried = true;
  const s = await ask(t, c.tx, c.voice, $("#reSum"), $("#reMsg"));
  state.busy = null;
  if (s){ c.s = s; c.byClaude = true; }
  if (s || state.sel[state.thread] !== c.id) render();
}
function autoCheck(){
  const c = th().calls.find(x => x.id === state.sel[state.thread]);
  if (!c || c.missed || c.byClaude || c.autoTried || state.off || !state.sample || state.busy || state.view !== "checkin") return;
  resummarize();
}
function parseTx(text, t){
  return text.split(/\n+/).map(l=>l.trim()).filter(Boolean).map(l => { const m = l.match(/^([^:]{1,24}):\s*(.*)$/);
    if (!m) return [t.short, l]; return [/^(ai|june|daily hello|caller|assistant)$/i.test(m[1].trim()) ? "AI" : t.short, m[2]]; });
}
async function addCall(){
  const t = th(), tx = parseTx($("#txInput").value, t), msg = $("#newMsg");
  if (tx.length < 2){ msg.textContent = "Paste at least two lines of conversation."; msg.className = "msg err"; return; }
  const s = await ask(t, tx, null, $("#sumNew"), msg);
  if (!s) return;
  const time = new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
  const c = {id:"n"+Date.now(), date:"Today, "+time, day:"New", time, dur:"new", tx, voice:null, s, byClaude:true};
  t.calls.unshift(c); state.sel[state.thread] = c.id; state.composing = false; state.view = "checkin"; render();
}

$("#stories").addEventListener("click", e => { const b = e.target.closest(".story"); if (b) location.hash = b.dataset.k; });
$("#seg").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; state.view = b.dataset.v; state.composing = false; render(); });
$("#view").addEventListener("change", e => {
  const inp = e.target.closest("[data-file]"); if (!inp || !inp.files?.[0]) return;
  const c = currentCall(); if (!c || c.id !== inp.dataset.file) return;
  if (c.localAudio){ if (playingId === c.id){ audio.pause(); playingId = null; } URL.revokeObjectURL(c.localAudio); }
  c.localAudio = URL.createObjectURL(inp.files[0]); c.localName = inp.files[0].name;
  render(); togglePlay(c.id);
});
$("#view").addEventListener("click", e => {
  const pb = e.target.closest("[data-play]"); if (pb){ togglePlay(pb.dataset.play); return; }
  const sp = e.target.closest("[data-speed]"); if (sp){ const i = SPEEDS.indexOf(audio.playbackRate); audio.playbackRate = SPEEDS[(i + 1) % SPEEDS.length]; sp.textContent = audio.playbackRate + "\u00d7"; return; }
  const sw = e.target.closest(".pwrap.seekable"); if (sw && !e.target.closest(".plegend")){
    const c = currentCall(); if (!c) return;
    const strip = sw.querySelector(".pstrip").getBoundingClientRect(), f = Math.min(1, Math.max(0, (e.clientX - strip.left) / strip.width));
    const go = () => { audio.currentTime = f * audio.duration; syncPlayer(); };
    if (playingId !== c.id){ audio.src = srcOf(c); playingId = c.id; audio.addEventListener("loadedmetadata", () => { go(); audio.play().catch(() => {}); }, {once:true}); }
    else if (isFinite(audio.duration)) { go(); if (audio.paused) audio.play().catch(() => {}); }
    return;
  }
  if (e.target.closest("#addTrend")){ state.tpick = !state.tpick; render(); return; }
  const at = e.target.closest("[data-addt]"); if (at){ setTrends([...trendsOf(), at.dataset.addt]); state.tpick = false; render(); return; }
  const rt = e.target.closest("[data-rmt]"); if (rt){ setTrends(trendsOf().filter(x => x !== rt.dataset.rmt)); render(); return; }
  if (e.target.closest("#addCond")){ state.pick = !state.pick; render(); return; }
  const ad = e.target.closest("[data-add]"); if (ad){ const k = ad.dataset.add;
    if (CAT.some(x => x[0] === k)) setExtra([...ex(), k]); else setPerson({hidden: hiddenOf().filter(x => x !== k)});
    state.pick = false; render(); return; }
  const rmc = e.target.closest("[data-rmc]"); if (rmc){ const k = rmc.dataset.rmc;
    if (CAT.some(x => x[0] === k)) setExtra(ex().filter(x => x !== k));
    else setPerson({hidden: [...new Set([...hiddenOf(), k])], also: (cfg(state.thread).also || []).filter(x => x !== k)});
    render(); return; }
  const it = e.target.closest(".item"); if (it){ state.sel[state.thread] = it.dataset.id; state.view = "checkin"; render(); window.scrollTo({top:0,behavior:"smooth"}); autoCheck(); return; }
  const wd = e.target.closest(".wk-day"); if (wd){ state.sel[state.thread] = wd.dataset.id; render(); autoCheck(); return; }
  const go = e.target.closest("[data-go]"); if (go){ state.view = go.dataset.go; state.composing = !!go.dataset.compose; render(); }
});
$("#gearBtn").onclick = () => { state.view = state.view === "settings" ? "checkin" : "settings"; state.composing = false; render(); window.scrollTo({top:0,behavior:"smooth"}); };
$("#tMeta").addEventListener("click", e => { if (e.target.closest("[data-go='settings']")){ state.view = "settings"; render(); } });
const tip = document.createElement("div"); tip.id = "tip"; tip.setAttribute("role", "tooltip"); document.body.appendChild(tip);
const LVW = {good:"Good", watch:"Watch", alert:"Concern", none:"No answer"};
let tipEl = null;
function clearHot(){ document.querySelectorAll(".spark circle.hot").forEach(c => c.classList.remove("hot")); }
function showTip(el){
  if (el === tipEl) return; tipEl = el;
  const d = el.dataset;
  tip.innerHTML = `<b>${esc(d.val)}</b><span class="d">${esc(d.day)}</span>${d.extra ? `<span class="d">${esc(d.extra)}</span>` : ""}<span class="lvl l-${esc(d.lv)}">${esc(d.lvtext || LVW[d.lv] || "")}</span>`;
  tip.classList.add("on");
  const r = el.getBoundingClientRect(), tw = tip.offsetWidth, tH = tip.offsetHeight;
  const x = Math.max(8, Math.min(r.left + r.width/2 - tw/2, innerWidth - tw - 8));
  let y = r.top - tH - 10; if (y < 8) y = r.bottom + 10;
  tip.style.left = x + "px"; tip.style.top = y + "px";
  clearHot();
  if (d.i != null) el.closest("svg")?.querySelector(`circle[data-i="${d.i}"]`)?.classList.add("hot");
}
function hideTip(){ if (!tipEl) return; tipEl = null; tip.classList.remove("on"); clearHot(); }
document.addEventListener("mouseover", e => { const el = e.target.closest?.("[data-tip]"); el ? showTip(el) : hideTip(); });
document.addEventListener("focusin", e => { const el = e.target.closest?.("[data-tip]"); el ? showTip(el) : hideTip(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") hideTip(); });
window.addEventListener("scroll", hideTip, {passive:true});

function fromHash(){ const h = location.hash.slice(1); state.thread = ORDER.includes(h) ? h : (ORDER.includes(state.thread) ? state.thread : ORDER[0]); state.view = "checkin"; state.composing = false; render(); }
window.addEventListener("hashchange", fromHash);
fromHash();
(async () => {
  try { state.sample = window.claude ? await window.claude.use("sample") : null; } catch { state.sample = null; }
  state.off = !state.sample; render();
})();
</script>
